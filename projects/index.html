<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vera — 網站設計 × 品牌視覺</title>
    <meta name="description" content="Vera — 以網站設計為核心，延伸品牌視覺、社群素材與數位推廣。8 年商業設計經驗，合作品牌包含 PHILIPS、SHARP、Belkin。" />
    <link rel="shortcut icon" href="./images/index/link.png">

    <meta property="og:title" content="Vera — 商業平面設計接案" />
    <meta property="og:description" content="Vera — 8 年商業設計，廣告圖、貼文、LP 介紹頁，交稿準時率 100%。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vera-design3.github.io/projects/" />
    <meta property="og:image" content="https://vera-design3.github.io/projects/images/index/og-home.png" />
    <link href="./images/index/apple.png" rel="apple-touch-icon" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style-new.css?v=20261020a">
    <script src="./js/layout-new.js?v=20261020a"></script>
</head>

<body>
    <main class="wrap">
        <section class="hero">
            <p class="eyebrow">網站設計 × 品牌視覺 · 台北</p>
            <h1>從網站到視覺，<br><em>設計品牌被看見的每一刻</em></h1>
            <p class="sub">
                為值得被記住的品牌，打造專屬視覺。<br class="sub-br">以網站設計為核心，延伸品牌視覺、社群素材與數位推廣。從資訊梳理到視覺呈現，打造一致、清楚且具辨識度的品牌形象。
            </p>
            <div class="tags filters" id="workFilters">
                <span class="active" data-cat="all">全部作品</span>
                <span data-cat="uiux">網站 · UI/UX</span>
                <span data-cat="lp">LP 介紹頁</span>
                <span data-cat="brand">品牌視覺</span>
                <span data-cat="ad">廣告圖設計</span>
                <span data-cat="social">貼文 / 限時動態</span>
            </div>
        </section>

        <section class="work">
            <div class="grid" id="workGrid">
                <a href="./project-zangan.html" class="card" data-tags="uiux">
                    <div class="thumb"><img loading="lazy" src="./images/Project/cover-zangan.webp" alt="蘵感美學補習班"></div>
                    <div class="meta"><h3>蘵感美學補習班</h3><span class="cat">UI/UX · Front-end</span></div>
                </a>
                <a href="./project-gym-mars.html" class="card" data-tags="social ad">
                    <div class="thumb"><img loading="lazy" src="./images/work/gym-mars/cover-8.webp" alt="gym mars 健身房"></div>
                    <div class="meta"><h3>gym mars 健身房</h3><span class="cat">gym mars</span></div>
                </a>
                <a href="./project-mars.html" class="card" data-tags="ad social">
                    <div class="thumb"><img loading="lazy" src="./images/work/mars/cover-5.webp" alt="MARS 高蛋白粉"></div>
                    <div class="meta"><h3>MARS 高蛋白粉</h3><span class="cat">MARS</span></div>
                </a>
                <a href="./project-legin.html" class="card" data-tags="social ad">
                    <div class="thumb"><img loading="lazy" src="./images/work/legin%20%E7%9A%AE%E6%8B%89%E6%8F%90%E6%96%AF/cover-6.webp" alt="Legin 皮拉提斯"></div>
                    <div class="meta"><h3>Legin 皮拉提斯</h3><span class="cat">Legin</span></div>
                </a>
            </div>
            <p class="work-empty" id="workEmpty" hidden>此分類暫無作品</p>
        </section>
    </main>

    <script>
        (function () {
            var filters = document.querySelectorAll('#workFilters span');
            var cards = document.querySelectorAll('#workGrid .card');
            var empty = document.getElementById('workEmpty');
            function apply(cat) {
                var shown = 0;
                filters.forEach(function (x) { x.classList.toggle('active', x.dataset.cat === cat); });
                cards.forEach(function (card) {
                    var tags = (card.dataset.tags || '').split(' ');
                    var on = (cat === 'all' || tags.indexOf(cat) !== -1);
                    card.style.display = on ? '' : 'none';
                    // 篩選後顯示的卡片確保可見（避免進場動畫殘留 opacity 0）
                    if (on) { card.classList.add('is-visible'); shown++; }
                });
                if (empty) empty.hidden = shown !== 0;
            }
            filters.forEach(function (f) {
                f.addEventListener('click', function () { apply(f.dataset.cat); });
            });
            // 從漢堡選單帶 ?cat= 進來時，自動套用該分類篩選並捲到作品區
            var cat = new URLSearchParams(location.search).get('cat');
            var valid = ['ad', 'social', 'lp', 'brand', 'uiux'];
            if (cat && valid.indexOf(cat) !== -1) {
                apply(cat);
                var work = document.querySelector('.work');
                if (work) work.scrollIntoView();
            }
        })();
    </script>
</body>

</html>
